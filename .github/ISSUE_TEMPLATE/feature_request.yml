name: "Feature request"
description: "Suggest an improvement to BustaCode"
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Explain the problem and the benefit. Suggestions are welcome but not delivery commitments."
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "BustaAI / agents"
        - "BustaAgents"
        - "IDE / editor"
        - "Git / worktrees"
        - "MCP / integrations"
        - "Docker / DevOps / SSH"
        - "Graph / architecture"
        - "Accessibility"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What problem are you trying to solve?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "What would you like to change?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives or examples (optional)"
